name: Build ImmortalWrt MT3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予发布 Releases 的权限

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt update -y
        sudo apt full-upgrade -y
        # 安装 ImmortalWrt 编译完整依赖（避免隐性失败）
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
          rsync unzip zlib1g-dev file wget curl swig libelf-dev \
          libglib2.0-dev libfuse3-dev pkg-config

    - name: Add third-party feeds (去重 + 镜像加速)
      run: |
        # 备份原始 feeds 配置
        cp feeds.conf.default feeds.conf.default.bak
        
        # 1. 添加 passwall 源（去重逻辑，避免重复定义）
        if ! grep -qE "^src-git passwall" feeds.conf.default; then
          # 使用镜像加速拉取 passwall（解决 GitHub 拉取超时）
          echo "src-git passwall https://mirror.ghproxy.com/https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
          echo "✅ Added passwall feed (mirror)"
        else
          echo "ℹ️ passwall feed already exists, skip"
        fi
        
        # 2. 添加 rtp2httpd 源（请替换为正确的源地址，否则会提示目录缺失）
        if ! grep -qE "^src-git rtp2httpd" feeds.conf.default; then
          # 请将下方链接替换为真实的 rtp2httpd 源地址，否则注释掉这行
          # echo "src-git rtp2httpd https://mirror.ghproxy.com/https://github.com/xxx/rtp2httpd.git" >> feeds.conf.default
          echo "ℹ️ rtp2httpd feed not added (please set correct source URL)"
        else
          echo "ℹ️ rtp2httpd feed already exists"
        fi
        
        # 3. 全局镜像加速 OpenWrt 官方 feeds
        sed -i 's#https://git.openwrt.org#https://mirror.ghproxy.com/https://git.openwrt.org#g' feeds.conf.default
        
        # 打印最终 feeds 配置（便于日志排查）
        echo "=== Final feeds.conf.default ==="
        cat feeds.conf.default

    - name: Update and install feeds (强制修复目录缺失)
      run: |
        # 1. 强制清理所有旧 feeds 缓存和目录（核心修复）
        ./scripts/feeds clean -a
        rm -rf ./feeds/*  # 清空旧 feeds 目录
        mkdir -p ./feeds  # 重建 feeds 目录
        
        # 2. 强制更新所有 feeds（-f 强制刷新，避免缓存）
        ./scripts/feeds update -a -f
        
        # 3. 强制安装所有 feeds（-f 强制覆盖安装）
        ./scripts/feeds install -a -f
        
        # 4. 单独安装 passwall（确保优先级）
        ./scripts/feeds install passwall || {
          echo "❌ passwall install failed! Check source URL"
          exit 1  # 可选：如果 passwall 是必须的，安装失败则终止
        }
        
        # 5. 尝试安装 rtp2httpd（非必须则注释 exit 1）
        ./scripts/feeds install rtp2httpd || {
          echo "⚠️ rtp2httpd install failed (ignore if not needed)"
          # exit 1  # 如需强制安装，取消注释
        }
        
        # 6. 详细验证目录是否存在（关键排查步骤）
        echo "=== Feeds directory check ==="
        ls -la ./feeds/
        echo "=== passwall directory check ==="
        if [ -d "./feeds/passwall" ]; then
          echo "✅ passwall directory exists"
          ls -la ./feeds/passwall | head -10
        else
          echo "❌ passwall directory NOT found!"
          exit 1
        fi
        echo "=== rtp2httpd directory check ==="
        if [ -d "./feeds/rtp2httpd" ]; then
          echo "✅ rtp2httpd directory exists"
        else
          echo "⚠️ rtp2httpd directory NOT found (ignore if not needed)"
        fi

    - name: Load custom config
      run: |
        # 检查自定义配置文件，无则生成默认配置
        if [ -f .config ]; then
          echo "ℹ️ Using existing .config"
          cp .config .config.bak
        else
          echo "ℹ️ No .config found, generate default config"
        fi
        make defconfig

    - name: Cache build files
      uses: actions/cache@v4
      with:
        path: |
          build_dir
          staging_dir
          dl
          feeds
        key: ${{ runner.os }}-immortalwrt-mt3000-${{ hashFiles('**/.config') }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-mt3000-

    - name: Compile firmware
      run: |
        # 先多线程编译，失败则单线程输出详细日志（便于排查编译错误）
        make -j$(nproc) || {
          echo "❌ Multi-thread build failed, retry with single thread"
          make -j1 V=s
        }

    - name: Upload firmware to artifact
      uses: actions/upload-artifact@v4
      with:
        name: MT3000-firmware-${{ github.run_number }}
        path: bin/targets/**
        retention-days: 7  # 产物保留7天

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: MT3000-Build-${{ github.run_number }}
        name: ImmortalWrt MT3000 Build ${{ github.run_number }}
        files: bin/targets/**/*
        draft: false
        prerelease: false
