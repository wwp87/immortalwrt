name: Build ImmortalWrt MT3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 赋予发布Releases权限

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt update -y && sudo apt full-upgrade -y
        # 安装完整编译依赖
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
          rsync unzip zlib1g-dev file wget curl swig libelf-dev \
          libglib2.0-dev libfuse3-dev pkg-config

    - name: Add third-party feeds (去重+镜像加速)
      run: |
        # 备份原始配置
        cp feeds.conf.default feeds.conf.default.bak
        
        # 1. 清理重复的passwall定义（核心兜底）
        sed -i '/^src-git passwall/d' feeds.conf.default
        
        # 2. 添加passwall源（镜像加速）
        echo "src-git passwall https://mirror.ghproxy.com/https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
        
        # 3. 如需rtp2httpd，替换为真实地址（无则注释）
        # sed -i '/^src-git rtp2httpd/d' feeds.conf.default
        # echo "src-git rtp2httpd https://mirror.ghproxy.com/https://github.com/xxx/rtp2httpd.git" >> feeds.conf.default
        
        # 4. 全局镜像加速官方feeds
        sed -i 's#https://git.openwrt.org#https://mirror.ghproxy.com/https://git.openwrt.org#g' feeds.conf.default
        
        # 打印最终配置
        echo "=== Final feeds.conf.default ==="
        cat feeds.conf.default

    - name: Update and install feeds (强制+手动克隆兜底)
      run: |
        # 1. 强制清理旧feeds
        ./scripts/feeds clean -a
        rm -rf ./feeds/* && mkdir -p ./feeds
        
        # 2. 强制更新feeds
        ./scripts/feeds update -a -f || {
          echo "⚠️ feeds update失败，尝试手动克隆核心feeds"
          # 手动克隆passwall到feeds目录（兜底方案）
          git clone --depth=1 https://mirror.ghproxy.com/https://github.com/xiaorouji/openwrt-passwall.git ./feeds/passwall
          # 手动克隆rtp2httpd（替换为真实地址）
          # git clone --depth=1 https://mirror.ghproxy.com/https://github.com/xxx/rtp2httpd.git ./feeds/rtp2httpd
        }
        
        # 3. 强制安装feeds
        ./scripts/feeds install -a -f
        
        # 4. 手动确认passwall安装
        ./scripts/feeds install passwall || true
        
        # 5. 终极验证目录（不存在则手动创建+克隆）
        echo "=== 终极目录验证 ==="
        if [ ! -d "./feeds/passwall" ]; then
          echo "❌ passwall目录缺失，手动克隆..."
          git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall.git ./feeds/passwall
          if [ $? -ne 0 ]; then
            echo "❌ 手动克隆passwall失败，请检查网络/源地址"
            exit 1
          fi
        else
          echo "✅ passwall目录存在"
        fi
        
        # rtp2httpd验证（无则注释）
        # if [ ! -d "./feeds/rtp2httpd" ]; then
        #   echo "❌ rtp2httpd目录缺失，手动克隆..."
        #   git clone --depth=1 https://github.com/xxx/rtp2httpd.git ./feeds/rtp2httpd
        # fi
        
        # 打印最终feeds目录结构
        ls -la ./feeds/

    - name: Load custom config
      run: |
        [ -f .config ] && cp .config .config.bak || echo "生成默认配置"
        make defconfig

    - name: Cache build files
      uses: actions/cache@v4
      with:
        path: |
          build_dir
          staging_dir
          dl
          feeds
        key: ${{ runner.os }}-immortalwrt-mt3000-${{ hashFiles('**/.config') }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-mt3000-

    - name: Compile firmware
      run: |
        # 多线程失败则单线程输出详细日志
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware to artifact
      uses: actions/upload-artifact@v4
      with:
        name: MT3000-firmware-${{ github.run_number }}
        path: bin/targets/**
        retention-days: 7

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: MT3000-Build-${{ github.run_number }}
        name: ImmortalWrt MT3000 Build ${{ github.run_number }}
        files: bin/targets/**/*
        draft: false
        prerelease: false
