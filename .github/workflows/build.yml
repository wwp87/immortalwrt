name: Build ImmortalWrt MT3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt update
        # 完整的 ImmortalWrt 编译依赖
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
          rsync unzip zlib1g-dev file wget curl swig libelf-dev

    - name: Add third-party feeds (自动去重，避免重复定义)
      run: |
        # 备份原有 feeds 配置
        cp feeds.conf.default feeds.conf.default.bak
        
        # 核心修复：先检查是否已存在 passwall，不存在才添加（避免重复）
        if ! grep -qE "^src-git passwall" feeds.conf.default; then
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
          echo "Added passwall feed successfully"
        else
          echo "passwall feed already exists, skip adding"
        fi
        
        # 如需添加 rtp2httpd，同样先检查再添加（替换为正确源地址）
        # if ! grep -qE "^src-git rtp2httpd" feeds.conf.default; then
        #   echo "src-git rtp2httpd https://github.com/xxx/rtp2httpd.git" >> feeds.conf.default
        # fi
        
        # 镜像加速：解决海外源拉取超时
        sed -i 's#https://git.openwrt.org#https://mirror.ghproxy.com/https://git.openwrt.org#g' feeds.conf.default
        
        # 查看最终 feeds 配置（日志中可核对）
        cat feeds.conf.default | grep -E "passwall|rtp2httpd"

    - name: Update and install feeds
      run: |
        # 清理旧 feeds 缓存
        ./scripts/feeds clean
        # 更新所有 feeds（强制刷新）
        ./scripts/feeds update -a -f
        # 安装所有 feeds 包
        ./scripts/feeds install -a
        # 单独确认 passwall 安装
        ./scripts/feeds install passwall || echo "passwall install failed (ignore if not needed)"
        # 验证目录（日志中查看结果）
        ls -l ./feeds/ | grep passwall || echo "passwall directory not found"

    - name: Load custom config
      run: |
        [ -f .config ] && echo "Using existing .config" || echo "No .config found, generate default"
        make defconfig

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build_dir
          staging_dir
          dl
        key: ${{ runner.os }}-immortalwrt-${{ hashFiles('**/.config') }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-

    - name: Compile firmware
      run: |
        # 多线程编译失败时，单线程输出详细日志（便于排查）
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware to artifact
      uses: actions/upload-artifact@v4
      with:
        name: MT3000-firmware
        path: bin/targets/**

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: MT3000-${{ github.run_number }}
        name: MT3000 Build ${{ github.run_number }}
        files: bin/targets/**/*
