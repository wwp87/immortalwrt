name: Build ImmortalWrt MT3000

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup build environment
      run: |
        sudo apt update
        # 补充 ImmortalWrt 编译所需的完整依赖（避免依赖缺失导致编译失败）
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
          rsync unzip zlib1g-dev file wget curl swig libelf-dev

    - name: Add third-party feeds (核心修复：添加缺失的 feeds 源)
      run: |
        # 备份原有 feeds 配置
        cp feeds.conf.default feeds.conf.default.bak
        # 添加 passwall 源（解决 passwall 目录缺失）
        echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall.git" >> feeds.conf.default
        # 如需添加 rtp2httpd 源，替换下方链接（请确认源地址正确性）
        # echo "src-git rtp2httpd https://github.com/xxx/rtp2httpd.git" >> feeds.conf.default
        # 可选：添加镜像加速，解决 GitHub 拉取超时
        sed -i 's#https://git.openwrt.org#https://mirror.ghproxy.com/https://git.openwrt.org#g' feeds.conf.default

    - name: Update and install feeds
      run: |
        ./scripts/feeds clean
        ./scripts/feeds update -a
        # 强制安装所有 feeds，确保 passwall/rtp2httpd 目录被创建
        ./scripts/feeds install -a
        # 单独安装 passwall 确保生效
        ./scripts/feeds install passwall || echo "passwall 安装失败，跳过（可能源地址问题）"
        # 验证目录是否存在（日志中可查看结果）
        ls -l ./feeds/ | grep -E "passwall|rtp2httpd" || echo "部分 feeds 目录未找到，请检查源地址"

    - name: Load custom config
      run: |
        [ -f .config ] && echo "Using existing .config" || echo "No .config found"
        make defconfig

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build_dir
          staging_dir
          dl
        key: ${{ runner.os }}-immortalwrt-${{ hashFiles('**/.config') }}
        restore-keys: |
          ${{ runner.os }}-immortalwrt-

    - name: Compile firmware
      run: |
        # 先尝试多线程编译，失败则单线程输出详细日志（便于排查问题）
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware to artifact
      uses: actions/upload-artifact@v4
      with:
        name: MT3000-firmware
        path: bin/targets/**

    - name: Upload to Releases
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'workflow_dispatch'
      with:
        tag_name: MT3000-${{ github.run_number }}
        name: MT3000 Build ${{ github.run_number }}
        files: bin/targets/**/*
